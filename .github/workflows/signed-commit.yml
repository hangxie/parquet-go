name: Check signed commits in PR
# pull_request_target only: the pull_request token cannot comment on fork PRs,
# and running both triggers doubles the runs. Safe here because the job never
# checks out or executes PR-authored code.
on: pull_request_target

jobs:
  check-signed-commits:
    name: Check signed commits in PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Advisory only, and knowingly left that way: the action reads a single
      # API page, so PRs past 30 commits may not get the signing-instructions
      # comment. Not worth working around -- enforcement is the ruleset's
      # required_signatures rule, which rejects unsigned commits server-side.
      - name: Check signed commits in PR
        uses: 1Password/check-signed-commits-action@v1
