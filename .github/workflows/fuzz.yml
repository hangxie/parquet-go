name: Fuzz

permissions:
  contents: read

on:
  # Nightly deep run; never gates PRs since fuzzing is non-deterministic.
  schedule:
    - cron: '0 7 * * *'
  # Manual run with an optional custom duration per target.
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzz duration per target (e.g. 60s, 5m)
        required: false
        default: 60s
      notify:
        description: File or update the failure issue, as a scheduled run does
        type: boolean
        default: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Each target already uses every core, so shards split targets across runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: types
            pkgs: ./types
          - shard: encoding
            pkgs: ./internal/encoding
          # Exclusion keeps packages that gain fuzz tests later covered.
          - shard: other
            pkgs: ./...
            skip: '.*/(types|internal/encoding)'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Installing Dependencies
        run: make deps
      - name: Locate fuzz corpus cache
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # setup-go re-saves GOCACHE only when go.sum changes, so carry the corpus over separately.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-${{ matrix.shard }}-
      - name: Running fuzz tests
        run: >-
          make fuzz FUZZTIME=${{ github.event.inputs.fuzztime || '60s' }}
          FUZZ_PKGS='${{ matrix.pkgs }}' FUZZ_SKIP='${{ matrix.skip }}'
      # Failing runs found something, so their corpus is the most valuable to keep.
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}
      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.shard }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # Scheduled runs fail silently otherwise; keep one open issue per failure streak.
  notify:
    needs: fuzz
    if: always() && needs.fuzz.result != 'success' && (github.event_name == 'schedule' || inputs.notify)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.fuzz.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly fuzz run failing"
          body="Fuzz run ${RESULT}: ${RUN_URL}"
          num=$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
